name: Portfolio JL - Actualizar Briefing

# Ejecutar cada lunes a las 22:45 CET (21:45 UTC)
on:
  schedule:
    - cron: '45 21 * * 1'  # Lunes 21:45 UTC = 22:45 CET
  workflow_dispatch:       # También se puede ejecutar manualmente

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Portfolio JL backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python3 app.py
      
      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Portfolio JL Bot"
          git add -A
          git commit -m "🤖 Auto-update: Portfolio briefing $(date +'%Y-%m-%d %H:%M')" || true
          git push
